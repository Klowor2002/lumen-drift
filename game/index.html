<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Lumen Drift — a light-moth cavern arcade</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a061a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #test-result { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lumen Drift: fly Luma the light-moth through the cavern, gather light-spores, dodge thorn-crystals, reach the Sunwell at Depth 10"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<p id="test-result" aria-hidden="true"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
